<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Katalog</title>
  <meta name="description" content="Mahsulotlar katalogi">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b4f8a'/%3E%3Cpath d='M18 18h12v12H18zM34 18h12v12H34zM18 34h12v12H18zM34 34h12v12H34z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner wrap">
      <a class="brand" href="./" aria-label="Bosh sahifa">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-shop="name">Katalog</span>
      </a>

      <label class="search" for="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Mahsulot qidirish…" autocomplete="off" enterkeyhint="search">
        <kbd class="search__kbd" aria-hidden="true">/</kbd>
      </label>

      <a class="btn btn--ghost topbar__contact" id="contact-btn" href="#kontakt" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.5 2.8 11.7c-.9.4-.9 1.6.1 1.9l4.6 1.4 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.9 3.6c.7.5 1.7.1 1.9-.7l3-15.5c.2-1-.8-1.8-1.6-1.4Z"/><path d="m7.6 15 10-7.2"/></svg>
        <span>Bog'lanish</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="hero__eyebrow"><span data-hero="eyebrow">Katalog</span></p>
      <h1 class="hero__title" data-shop="tagline">Sifatli mahsulotlar — qulay narxlarda</h1>
      <p class="hero__meta" id="hero-meta" aria-live="polite">&nbsp;</p>
    </section>

    <div class="toolbar">
      <div class="toolbar__inner wrap">
        <nav class="chips" id="chips" aria-label="Bo'limlar"></nav>
        <label class="sort">
          <span class="visually-hidden">Saralash</span>
          <select id="sort">
            <option value="default">Tavsiya etilgan</option>
            <option value="new">Avval yangilari</option>
            <option value="cheap">Avval arzonlari</option>
            <option value="expensive">Avval qimmatlari</option>
            <option value="name">Nomi bo'yicha</option>
          </select>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </label>
      </div>
    </div>

    <section class="wrap">
      <div class="grid" id="grid" aria-live="polite"></div>
      <div class="state" id="state" hidden></div>
    </section>
  </main>

  <footer class="footer" id="kontakt">
    <div class="wrap footer__inner">
      <div>
        <p class="footer__name" data-shop="name">Katalog</p>
        <p class="footer__text" data-shop="address"></p>
      </div>
      <ul class="footer__links" id="footer-links"></ul>
    </div>
    <div class="wrap footer__bottom">
      <span>© <span id="year"></span> <span data-shop="name">Katalog</span></span>
    </div>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal__panel">
      <button class="modal__close" type="button" data-close aria-label="Yopish">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>

      <div class="gallery">
        <div class="gallery__stage" id="gallery-stage">
          <img id="gallery-img" alt="">
          <button class="gallery__nav gallery__nav--prev" type="button" data-step="-1" aria-label="Oldingi rasm">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <button class="gallery__nav gallery__nav--next" type="button" data-step="1" aria-label="Keyingi rasm">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <span class="gallery__count" id="gallery-count"></span>
        </div>
        <div class="gallery__thumbs" id="gallery-thumbs"></div>
      </div>

      <div class="detail">
        <p class="detail__cat" id="modal-cat"></p>
        <h2 class="detail__title" id="modal-title"></h2>
        <p class="detail__price" id="modal-price"></p>
        <div class="detail__desc" id="modal-desc"></div>
        <div class="detail__actions" id="modal-actions"></div>
        <button class="detail__share" type="button" id="share-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          Havolani ulashish
        </button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js" defer></script>
</body>
</html>
